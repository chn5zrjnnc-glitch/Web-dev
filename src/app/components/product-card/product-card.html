<div class="card">
  <img [src]="product.image" alt="{{ product.name }}">
  <h3>{{ product.name }}</h3>
  <p>{{ product.description }}</p>
  <p>Price: {{ product.price }} ₸</p>
  <p>⭐ {{ product.rating }}</p>
  <a [href]="product.link" target="_blank">Open</a>
  <button (click)="share()">Share</button>
</div>
